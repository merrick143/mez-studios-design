<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Product banner canvas</title>
    <!-- Product-identity profile header, in the same house style as the live
         sharing image and the running Mez Studios banner: light ground, the
         wings lockup top-left, heavy black headline, product art on the right.
         Content sits left of centre and the art right, because LinkedIn
         overlaps the profile photo on the banner's bottom-left.
         Params: ?preset=linkedin|x  ?product=...  ?title=...  ?kicker=...
                 ?art=fan|core -->
    <link rel="stylesheet" href="./canvas.css" />
    <style>
      .canvas { background: #f8f8f8; color: #0b0b0b; }

      /* Same lockup geometry as the running banner: 35px in, 44px down. */
      .lockup {
        position: absolute;
        top: 44px; left: 92px;
        display: flex; align-items: center; gap: 12px;
      }
      .lockup svg { width: 29px; height: auto; display: block; fill: #0b0b0b; }
      .lockup span {
        font-size: 21.5px; font-weight: 500;
        letter-spacing: 0.01em; text-transform: uppercase; white-space: nowrap;
      }

      .copy {
        position: absolute;
        left: 92px; top: 50%;
        transform: translateY(-50%);
        width: 620px;
        margin-top: 22px;
      }
      .kicker {
        font-size: 14px; font-weight: 600;
        letter-spacing: 0.10em; text-transform: uppercase;
        color: #6f706d;
      }
      .title {
        margin: 16px 0 0;
        font-size: 54px;
        line-height: 56px;
        font-weight: 800;
        letter-spacing: -0.032em;
      }

      /* The fan, cropped by the banner's short height — the cards run off the
         bottom edge rather than being shrunk to fit, which keeps them the same
         size as everywhere else in the system. */
      .fan { position: absolute; right: 96px; top: 50%; width: 560px; height: 0; }
      .card {
        position: absolute;
        left: 50%; top: 0;
        width: 176px; height: 252px;
        margin: -126px 0 0 -88px;
        border-radius: 18px;
        background-position: center; background-size: cover;
        box-shadow: 0 22px 50px -18px rgb(11 11 11 / 42%);
        display: grid; align-content: center; justify-items: center;
        gap: 9px; padding: 0 16px;
        color: #fff; text-align: center;
      }
      .card img { width: 34px; filter: brightness(0) invert(1); }
      .card b { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
      .card i {
        font-style: normal; font-size: 8.5px; font-weight: 600;
        letter-spacing: 0.11em; text-transform: uppercase; opacity: 0.82; line-height: 1.4;
      }

      .solo {
        position: absolute;
        top: 50%; right: 110px;
        transform: translateY(-50%);
        width: 268px; height: 268px;
        border-radius: 50%;
        background-position: center; background-size: cover;
        box-shadow: 0 26px 64px -22px rgb(11 11 11 / 45%);
      }
      .solo img {
        position: absolute; top: 50%; left: 50%;
        width: 38%; transform: translate(-50%,-50%);
        filter: brightness(0) invert(1);
      }
    </style>
  </head>
  <body>
    <div class="canvas" id="canvas">
      <div class="lockup">
        <svg viewBox="0 0 512 363" aria-hidden="true">
          <path d="M45,0L105.89,0A45,45 0 0 1 146.58,25.78L239.69,222.87A45,45 0 0 1 244,242.09L244,316A45,45 0 0 1 199,361L45,361A45,45 0 0 1 0,316L0,45A45,45 0 0 1 45,0Z"/>
          <path d="M466,0L405.11,0A45,45 0 0 0 364.42,25.78L271.31,222.87A45,45 0 0 0 267,242.09L267,316A45,45 0 0 0 312,361L466,361A45,45 0 0 0 511,316L511,45A45,45 0 0 0 466,0Z"/>
        </svg>
        <span>Mez Systems</span>
      </div>

      <div class="copy">
        <div class="kicker" id="kicker"></div>
        <h1 class="title" id="title"></h1>
      </div>

      <div id="art"></div>
    </div>

    <script type="module">
      import { params, gradientUrl, WINGS, PRODUCTS } from './shared.js?v=2';

      const PRESETS = { linkedin: [1584, 396], x: [1500, 500] };
      const q = new URLSearchParams(location.search);
      const [w, h] = PRESETS[q.get('preset')] || PRESETS.linkedin;
      const canvas = document.getElementById('canvas');
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      const p = params();
      document.getElementById('kicker').textContent = q.get('kicker') || p.product.kicker;
      document.getElementById('title').textContent = q.get('title') || p.product.headline;

      const ORDER = ['claude-code-os', 'context-engine', 'aios', 'ai-ads-system', 'organic-content-os'];
      const SPLAY = [
        { x: -196, y: 44, r: -17, s: 0.94 },
        { x: -100, y: 12, r: -8.5, s: 0.97 },
        { x: 0, y: -14, r: 0, s: 1 },
        { x: 100, y: 12, r: 8.5, s: 0.97 },
        { x: 196, y: 44, r: 17, s: 0.94 },
      ];

      const art = document.getElementById('art');
      const mode = q.get('art') || (p.productKey === 'mez' ? 'fan' : 'core');

      if (mode === 'fan') {
        art.className = 'fan';
        const focus = ORDER.indexOf(p.productKey);
        const order = ORDER.slice();
        if (focus > -1 && focus !== 2) {
          const t = order[2]; order[2] = order[focus]; order[focus] = t;
        }
        [0, 4, 1, 3, 2].forEach(i => {
          const meta = PRODUCTS[order[i]], s = SPLAY[i];
          const el = document.createElement('div');
          el.className = 'card';
          el.style.backgroundImage = 'url("' + gradientUrl(meta.gradient) + '")';
          el.style.transform =
            'translate(' + s.x + 'px,' + s.y + 'px) rotate(' + s.r + 'deg) scale(' + s.s + ')';
          el.innerHTML = '<img src="' + WINGS + '" alt=""><b>' + meta.name + '</b><i>' + meta.fn + '</i>';
          art.appendChild(el);
        });
      } else {
        art.className = 'solo';
        art.style.backgroundImage = 'url("' + gradientUrl(p.gradient) + '")';
        const img = document.createElement('img');
        img.src = WINGS; img.alt = '';
        art.appendChild(img);
      }
    </script>
  </body>
</html>
