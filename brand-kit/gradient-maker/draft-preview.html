<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Private gradient draft · Mez Systems</title>
  <link rel="icon" href="../../favicon.svg">
  <link rel="stylesheet" href="../releases/foundations/dist/index.css">
  <link rel="stylesheet" href="./maker.css">
  <link rel="stylesheet" href="./draft-preview.css">
</head>
<body><main class="shell draft-page">
  <a class="text-link" href="./?public">← Gradient maker</a>
  <div class="intro"><div><p class="mz-type-ui-label">Private browser draft</p><h1 class="mz-type-display-title" id="draft-name">Your gradient.</h1></div></div>
  <p id="draft-status" role="status">Opening the draft saved in this browser…</p>
  <div class="compare-content draft-comparison" id="draft-content" hidden>
    <figure><img id="draft-source" alt="Original source gradient"><figcaption>Source PNG · colour authority</figcaption></figure>
    <figure><div class="material draft-material" id="draft-core" data-shape="sphere" role="img" aria-label="Living Core preview"><img class="wings" src="../source-pack/design-system-export/assets/wings.svg" alt=""></div><figcaption id="draft-mode">Exact static source</figcaption></figure>
  </div>
  <div class="draft-actions" id="draft-actions" hidden><a class="text-link" id="draft-download" download="gradient-source.png">Download source PNG ↓</a><button class="quiet-button" type="button" id="draft-export">Download complete package ↓</button></div>
  <p class="hint">This draft is stored in this browser. To share it or move it to another device, download the complete package.</p>
  <noscript><p>JavaScript is needed to open browser drafts. Your downloaded source PNGs remain usable without it.</p></noscript>
</main><script type="module" src="./draft-preview.js"></script></body>
</html>
