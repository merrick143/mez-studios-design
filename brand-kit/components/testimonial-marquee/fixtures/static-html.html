<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Testimonial Marquee · dependency-free fixture</title>
<link rel="stylesheet" href="../../../releases/foundations/dist/index.css" />
<link rel="stylesheet" href="../mez-testimonial-marquee.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--mz-space-10, 40px) var(--mz-space-6, 24px) var(--mz-space-18, 72px);
    background: var(--mz-surface-canvas, #f8f8f8);
    color: var(--mz-text-primary, #171715);
    font-family: var(--mz-font-body, system-ui, sans-serif);
  }
  main { width: min(1160px, 100%); margin-inline: auto; }
  .eyebrow {
    margin: 0 0 var(--mz-space-2, 8px);
    color: var(--mz-text-muted, #666662);
    font-size: var(--mz-type-ui-label-size, 12px);
    letter-spacing: var(--mz-type-ui-label-tracking, .09em);
    text-transform: uppercase;
  }
  h1 {
    max-inline-size: 14ch;
    margin: 0;
    font: var(--mz-type-display-title, 650 48px/1 var(--mz-font-display, system-ui));
    letter-spacing: var(--mz-type-display-title-tracking, -.044em);
  }
  .lede { max-inline-size: 62ch; margin: var(--mz-space-4, 16px) 0 0; color: var(--mz-text-muted, #666662); }
  .actions { display: flex; gap: var(--mz-space-2, 8px); margin-top: var(--mz-space-5, 20px); }
  .actions a { color: inherit; }
  mez-testimonial-marquee { margin-top: var(--mz-space-10, 40px); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">TASK-CMP-06 · canonical 1.0.0</p>
  <h1>Testimonial Marquee</h1>
  <p class="lede">
    Dependency-free HTML fixture. The bounded auto-scroll pauses on hover,
    focus and request. Add
    <code>?static</code> to inspect the complete reduced-motion recomposition.
  </p>
  <p class="actions"><a href="?static">Force static</a> <a href="./">Normal</a></p>

  <mez-testimonial-marquee
    src="./ai-os-testimonials.json"
    label="Operator testimonials for the AI OS"
    presentation="social-caption"
  >
    <p><a href="https://mez.systems/ai-os">Read the operator testimonials on the source page.</a></p>
  </mez-testimonial-marquee>
</main>
<script type="module" src="../mez-testimonial-marquee.js"></script>
</body>
</html>
