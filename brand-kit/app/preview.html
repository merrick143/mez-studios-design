<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Console preview</title>
    <!-- Compact tile for the landing page card, mirroring play-orb's ?bare
         preview: an icon, not the squeezed full page. -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #f8f8f8;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      .tile { display: grid; gap: 18px; justify-items: center; }
      .cores { display: flex; }
      .core {
        position: relative;
        width: clamp(44px, 12vw, 64px);
        aspect-ratio: 1;
        border-radius: 50%;
        background-position: center;
        background-size: cover;
        box-shadow: 0 1px 6px rgb(13 13 13 / 22%), 0 0 0 3px #f8f8f8;
      }
      .core + .core { margin-left: -14px; }
      .core img {
        position: absolute;
        top: 50%; left: 50%;
        width: 39%;
        transform: translate(-50%, -50%);
        filter: brightness(0) invert(1);
      }
      .caption {
        color: #666662;
        font-size: 10px;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="cores">
        <span class="core" style="background-image:url('../gradient-library/assets/static/mz-g13.webp')">
          <img src="../source-pack/design-system-export/assets/wings.svg" alt="" />
        </span>
        <span class="core" style="background-image:url('../gradient-library/assets/static/mz-g12.webp')"></span>
        <span class="core" style="background-image:url('../gradient-library/assets/static/mz-g06.webp')"></span>
        <span class="core" style="background-image:url('../gradient-library/assets/static/mz-g15.webp')"></span>
        <span class="core" style="background-image:url('../gradient-library/assets/static/mz-g20.webp')"></span>
      </div>
      <span class="caption">CONSOLE · REVIEW · RELEASES</span>
    </div>
  </body>
</html>
