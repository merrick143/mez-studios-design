<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Next Lab · 390px proofs</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        grid-template-columns: repeat(5, 390px);
        gap: 28px;
        width: max-content;
        margin: 0;
        padding: 28px;
        background: #171715;
        color: #f8f8f8;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      figure { margin: 0; }
      figcaption {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        color: #b8b8b1;
        font-size: 10px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 1px solid #4f4f4b;
        border-radius: 28px;
        background: #f8f8f8;
      }
    </style>
  </head>
  <body>
    <figure><figcaption><span>V01</span><span>390 × 844</span></figcaption><iframe title="V01 compact proof" data-target="v01" src="./"></iframe></figure>
    <figure><figcaption><span>V02</span><span>390 × 844</span></figcaption><iframe title="V02 compact proof" data-target="v02" src="./"></iframe></figure>
    <figure><figcaption><span>V03</span><span>390 × 844</span></figcaption><iframe title="V03 compact proof" data-target="v03" src="./"></iframe></figure>
    <figure><figcaption><span>V04</span><span>390 × 844</span></figcaption><iframe title="V04 compact proof" data-target="v04" src="./"></iframe></figure>
    <figure><figcaption><span>V05</span><span>390 × 844</span></figcaption><iframe title="V05 compact proof" data-target="v05" src="./"></iframe></figure>
    <script>
      document.querySelectorAll("iframe").forEach(frame => {
        frame.addEventListener("load", () => {
          const target = frame.contentDocument.getElementById(frame.dataset.target);
          frame.contentDocument.documentElement.style.scrollBehavior = "auto";
          frame.contentWindow.scrollTo(0, target.offsetTop - 64);
        });
      });
    </script>
  </body>
</html>
