<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Orb / gradient comparison</title>
<style>
  :root { --stage:#efedec; --ink:#1a1720; --ink-dim:#8e8998; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 4.5rem 2rem 5rem;
    background: var(--stage); color: var(--ink);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 3.5rem;
  }
  .masthead { text-align: center; display: grid; gap: .75rem; }
  .masthead h1 {
    margin: 0; font-size: .8125rem; font-weight: 600;
    letter-spacing: .28em; text-transform: uppercase;
  }
  .masthead p { margin: 0; font-size: .6875rem; letter-spacing: .1em; color: var(--ink-dim); }
  .grid {
    display: grid; gap: 3.25rem 2.5rem; width: 100%; max-width: 1180px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    justify-items: center;
  }
  .cell { display: grid; justify-items: center; gap: 1.1rem; }
  .meta { display: grid; justify-items: center; gap: .5rem; }
  .meta b { font-size: .75rem; font-weight: 600; letter-spacing: .16em; }
  .swatches { display: flex; gap: 4px; }
  .swatches i {
    width: 22px; height: 8px; border-radius: 2px; display: block;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.10);
  }
</style>
</head>
<body>
  <header class="masthead">
    <h1>Play Orb &middot; gradient comparison</h1>
    <p>Built by Claude Code from Mez Systems gradients. Hover any orb.</p>
  </header>
  <main class="grid">
    <section class="cell">
      <iframe src="orbs/MZ-G13.html?bare" title="MZ-G13" scrolling="no"
              style="width:300px;height:300px;border:0;background:transparent;color-scheme:light"></iframe>
      <div class="meta"><b>MZ-G13</b><div class="swatches"><i style="background:#69D9F4"></i><i style="background:#294288"></i><i style="background:#5C8CD0"></i><i style="background:#4168AA"></i><i style="background:#2D176E"></i></div></div>
    </section>
    <section class="cell">
      <iframe src="orbs/MZ-G20.html?bare" title="MZ-G20" scrolling="no"
              style="width:300px;height:300px;border:0;background:transparent;color-scheme:light"></iframe>
      <div class="meta"><b>MZ-G20</b><div class="swatches"><i style="background:#D78446"></i><i style="background:#F8CCAD"></i><i style="background:#ECA57A"></i><i style="background:#DA5054"></i><i style="background:#EE1256"></i></div></div>
    </section>
    <section class="cell">
      <iframe src="orbs/MZ-G06.html?bare" title="MZ-G06" scrolling="no"
              style="width:300px;height:300px;border:0;background:transparent;color-scheme:light"></iframe>
      <div class="meta"><b>MZ-G06</b><div class="swatches"><i style="background:#83F1EB"></i><i style="background:#D3B8EF"></i><i style="background:#B175E6"></i><i style="background:#8F46D0"></i><i style="background:#5C30C3"></i></div></div>
    </section>
    <section class="cell">
      <iframe src="orbs/MZ-G15.html?bare" title="MZ-G15" scrolling="no"
              style="width:300px;height:300px;border:0;background:transparent;color-scheme:light"></iframe>
      <div class="meta"><b>MZ-G15</b><div class="swatches"><i style="background:#75B89A"></i><i style="background:#20A695"></i><i style="background:#B6C673"></i><i style="background:#5DE2D3"></i><i style="background:#178679"></i></div></div>
    </section>
  </main>
</body>
</html>
